<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Launch Desk marketplace preview">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Desktop -->
  <rect width="1200" height="800" fill="url(#desk)"/>
  <circle cx="180" cy="140" r="1.4" fill="#f0f0fa" opacity="0.45"/>
  <circle cx="420" cy="90" r="1.1" fill="#f0f0fa" opacity="0.35"/>
  <circle cx="760" cy="160" r="1.3" fill="#f0f0fa" opacity="0.4"/>
  <circle cx="980" cy="220" r="0.9" fill="#f0f0fa" opacity="0.3"/>
  <circle cx="300" cy="520" r="1.2" fill="#f0f0fa" opacity="0.25"/>
  <circle cx="640" cy="640" r="1" fill="#f0f0fa" opacity="0.28"/>
  <text x="600" y="420" text-anchor="middle" fill="#f0f0fa" opacity="0.14" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="8">OMARCHY · LAUNCH DESK</text>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="44" fill="#0c0c0e" opacity="0.92"/>
  <rect x="0" y="44" width="1200" height="1" fill="#f0f0fa" opacity="0.06"/>
  <text x="28" y="28" fill="#f0f0fa" opacity="0.85" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">OMARCHY</text>
  <text x="140" y="28" fill="#f0f0fa" opacity="0.4" font-family="Arial, Helvetica, sans-serif" font-size="11">workspace 1</text>
  <text x="980" y="28" fill="#f0f0fa" opacity="0.55" font-family="ui-monospace, monospace" font-size="12">14:32</text>
  <rect x="1030" y="10" width="146" height="24" rx="6" fill="#f0f0fa" opacity="0.08"/>
  <text x="1044" y="27" fill="#f0f0fa" font-family="Arial, Helvetica, sans-serif" font-size="12">🚀  T-02:14:33</text>

  <!-- Panel -->
  <g filter="url(#soft)">
    <rect x="780" y="58" width="390" height="700" rx="14" fill="url(#panelGrad)" stroke="#2a2a30"/>
  </g>
  <text x="804" y="92" fill="#f0f0fa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4">LAUNCH DESK</text>
  <text x="804" y="112" fill="#f0f0fa" opacity="0.4" font-family="Arial, Helvetica, sans-serif" font-size="10">updated 11h ago · sample</text>

  <!-- Flip digits -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#f0f0fa">
    <text x="804" y="148" opacity="0.45" font-size="9" letter-spacing="1.5">TOTAL LAUNCHES</text>
    <g transform="translate(804,158)">
      <rect width="22" height="34" rx="3" fill="#252628"/><text x="11" y="24" text-anchor="middle" font-size="18" font-weight="700">0</text>
      <rect x="25" width="22" height="34" rx="3" fill="#252628"/><text x="36" y="24" text-anchor="middle" font-size="18" font-weight="700">7</text>
      <rect x="50" width="22" height="34" rx="3" fill="#252628"/><text x="61" y="24" text-anchor="middle" font-size="18" font-weight="700">2</text>
      <rect x="75" width="22" height="34" rx="3" fill="#252628"/><text x="86" y="24" text-anchor="middle" font-size="18" font-weight="700">1</text>
    </g>
    <text x="930" y="148" opacity="0.45" font-size="9" letter-spacing="1.5">LANDINGS</text>
    <g transform="translate(930,158)">
      <rect width="22" height="34" rx="3" fill="#252628"/><text x="11" y="24" text-anchor="middle" font-size="18" font-weight="700">0</text>
      <rect x="25" width="22" height="34" rx="3" fill="#252628"/><text x="36" y="24" text-anchor="middle" font-size="18" font-weight="700">6</text>
      <rect x="50" width="22" height="34" rx="3" fill="#252628"/><text x="61" y="24" text-anchor="middle" font-size="18" font-weight="700">6</text>
      <rect x="75" width="22" height="34" rx="3" fill="#252628"/><text x="86" y="24" text-anchor="middle" font-size="18" font-weight="700">4</text>
    </g>
    <text x="1056" y="148" opacity="0.45" font-size="9" letter-spacing="1.5">PENDING</text>
    <g transform="translate(1056,158)">
      <rect width="22" height="34" rx="3" fill="#252628"/><text x="11" y="24" text-anchor="middle" font-size="18" font-weight="700">0</text>
      <rect x="25" width="22" height="34" rx="3" fill="#252628"/><text x="36" y="24" text-anchor="middle" font-size="18" font-weight="700">1</text>
      <rect x="50" width="22" height="34" rx="3" fill="#252628"/><text x="61" y="24" text-anchor="middle" font-size="18" font-weight="700">2</text>
      <rect x="75" width="22" height="34" rx="3" fill="#252628"/><text x="86" y="24" text-anchor="middle" font-size="18" font-weight="700">9</text>
    </g>
  </g>
  <text x="804" y="214" fill="#f0f0fa" opacity="0.35" font-family="Arial, Helvetica, sans-serif" font-size="10">Consecutive successful launches: 206 · LL2</text>

  <!-- Next launch card -->
  <text x="804" y="248" fill="#f0f0fa" opacity="0.6" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" font-weight="700">NEXT LAUNCH</text>
  <rect x="804" y="260" width="342" height="88" rx="8" fill="#19191c" stroke="#2a2a2e"/>
  <text x="820" y="288" fill="#f0f0fa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Starlink Group 10-49</text>
  <text x="820" y="310" fill="#f0f0fa" opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="12">Falcon 9 Block 5 · T-02:14:33</text>
  <rect x="820" y="322" width="28" height="16" rx="3" fill="#1a3d2a"/>
  <text x="826" y="334" fill="#7dffa0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">Go</text>
  <rect x="1036" y="292" width="90" height="28" rx="4" fill="#f0f0fa"/>
  <text x="1058" y="311" fill="#0a0a0c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">WATCH</text>

  <!-- Detail snippet -->
