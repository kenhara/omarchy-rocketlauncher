  <text x="820" y="398" fill="#f0f0fa" opacity="0.4" font-family="Arial, Helvetica, sans-serif" font-size="10">LEO · Pad SLC-40 · ASDS OCISLY</text>
  <text x="820" y="424" fill="#f0f0fa" opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="11">A batch of satellites for the Starlink</text>
  <text x="820" y="440" fill="#f0f0fa" opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="11">mega-constellation — Falcon 9 loft…</text>

  <!-- Upcoming -->
  <text x="804" y="484" fill="#f0f0fa" opacity="0.6" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" font-weight="700">UPCOMING</text>
  <rect x="804" y="496" width="342" height="52" rx="8" fill="#19191c" stroke="#2a2a2e"/>
  <text x="820" y="518" fill="#f0f0fa" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Starlink Group 15-22</text>
  <text x="820" y="536" fill="#f0f0fa" opacity="0.4" font-family="Arial, Helvetica, sans-serif" font-size="10">Falcon 9 · NET Aug 25</text>
  <rect x="804" y="556" width="342" height="52" rx="8" fill="#19191c" stroke="#2a2a2e"/>
  <text x="820" y="578" fill="#f0f0fa" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Nancy Grace Roman Space Telescope</text>
  <text x="820" y="596" fill="#f0f0fa" opacity="0.4" font-family="Arial, Helvetica, sans-serif" font-size="10">Falcon Heavy · NET Aug 30</text>

  <!-- Attribution -->
  <text x="804" y="730" fill="#f0f0fa" opacity="0.32" font-family="Arial, Helvetica, sans-serif" font-size="10">Launch data: The Space Devs (LL2) · Unofficial</text>
</svg>
